services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-${DB_NAME:-plataforma}}
      MARIADB_USER: ${MARIADB_USER:-${DB_USER:-user}}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-${DB_PASSWORD:-pass}}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker-entrypoint-initdb.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mariadb_data:
