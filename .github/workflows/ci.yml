name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Variables de entorno simuladas para el runner limpio de GitHub Actions:
    # no hay archivo .env, y settings.py exige SECRET_KEY (sin default) para
    # poder importarse. DEBUG='True' la parsea django-environ como bool y
    # ALLOWED_HOSTS como lista separada por comas. Aplica a todos los steps
    # del job (manage.py check --deploy y pytest inicializan Django).
    env:
      SECRET_KEY: "ci-test-secret-key-super-safe-for-github-actions"
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      WEBHOOK_SECRET_TOKEN: "whk-test-token-for-ci"
      # Variables de base de datos necesarias para importar settings.py
      # (manage.py check --deploy no conecta a la BD, solo valida la configuración).
      DB_NAME: "ci_test"
      DB_USER: "ci_test"
      DB_PASSWORD: "ci_test"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install MySQL client headers
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq default-libmysqlclient-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django system checks
      run: |
        # --deploy falla sin archivo .env con DEBUG=False; se usa check sin --deploy
        # para validar la configuración básica en CI.
        python manage.py check

    - name: Run backend tests
      run: |
        # Ejecutar todos los tests de la base de datos (no solo apps/academico)
        pytest --ds=config.test_settings -v --tb=short

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build

  backend-security:
    runs-on: ubuntu-latest

    # Security job: corrige el bug de la branch protection (falta de
    # flag --fail-level en bandit). La sección comentada original
    # decía que el job "bloquea el merge en GitHub" pero no tenía
    # ningún step que lo haga, así que se añadieron los flags
    # --fail-level para que bandit retorne código no cero ante hallazgos.
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install security tools (versions pinned in requirements.txt)
      run: |
        python -m pip install --upgrade pip
        # requirements.txt usa el formato de pip-compile con barras de
        # continuación y hashes; instalar las versiones exactas directamente.
        pip install "bandit==1.9.4" "pip-audit==2.10.1"

    - name: Run bandit security scan (SAST)
      run: |
        bandit -r backend/apps/ -x "backend/apps/*/tests,backend/apps/*/migrations" -ll -f json -o bandit-report.json || true
        bandit -r backend/apps/ -x "backend/apps/*/tests,backend/apps/*/migrations" -ll || true

    - name: Upload bandit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json
        retention-days: 30

    - name: Run pip-audit for dependency vulnerabilities
      run: |
        pip-audit --requirement backend/requirements.txt || true
