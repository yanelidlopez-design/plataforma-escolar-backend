name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install MySQL client headers
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq default-libmysqlclient-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django system checks
      run: |
        python manage.py check --deploy

    - name: Run backend tests
      run: |
        pytest apps/academico/tests/ -v

  # Misión 11 — Job independiente de seguridad: corre en paralelo a los tests
  # y bloquea el pipeline ante hallazgos:
  #   - bandit   (SAST): falla con severidad MEDIUM o superior (-ll);
  #                       el informe JSON se sube como artefacto para auditoría.
  #   - pip-audit (dependencias): --strict falla ante cualquier CVE conocido.
  # Para bloquear el merge en GitHub, añadir en Settings > Branches >
  # Branch protection la regla "Require status checks to pass" con
  # backend-tests y backend-security.
  backend-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install security tools (versions pinned in requirements.txt)
      run: |
        python -m pip install --upgrade pip
        pip install $(grep -E '^(bandit|pip-audit)==' requirements.txt)

    - name: Run bandit security scan (SAST)
      run: |
        bandit -r apps/ -f json -o bandit-report.json || true
        bandit -r apps/ -ll

    - name: Upload bandit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json
        retention-days: 30

    - name: Run pip-audit for dependency vulnerabilities
      run: |
        pip-audit --strict --requirement requirements.txt
